name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [auth-service, geo-service]
    steps:
      - uses: actions/checkout@v4

      - name: Linter de Dockerfile (hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ matrix.service }}/Dockerfile

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Linter de Python (ruff)
        run: |
          pip install ruff==0.8.4
          ruff check ${{ matrix.service }}

  test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [auth-service, geo-service]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.service }}/requirements*.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Tests (pytest)
        run: pytest -v

  integration:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Preparar variables de entorno y validar compose.yaml
        run: |
          cp .env.example .env
          docker compose config -q

      - name: Levantar el sistema completo
        run: docker compose up -d --build --wait

      - name: Pruebas de extremo a extremo
        run: bash tests/e2e.sh

      - name: Mostrar logs (solo si algo falló)
        if: failure()
        run: docker compose logs

      - name: Apagar y limpiar
        if: always()
        run: docker compose down -v

  publish:
    needs: integration
    # Solo al fusionar en main, nunca en un pull request
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [auth-service, geo-service]
    steps:
      - uses: actions/checkout@v4

      - name: Iniciar sesión en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calcular etiquetas de la imagen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/agrotrace-${{ matrix.service }}
          tags: |
            type=sha
            type=raw,value=latest

      - name: Construir y publicar
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
