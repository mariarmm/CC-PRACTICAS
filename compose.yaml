name: agrotrace

services:
  auth-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${AUTH_DB_NAME:?falta AUTH_DB_NAME}
      POSTGRES_USER: ${AUTH_DB_USER:?falta AUTH_DB_USER}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:?falta AUTH_DB_PASSWORD}
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    networks: [auth-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  auth-service:
    build: ./auth-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${AUTH_DB_USER}:${AUTH_DB_PASSWORD}@auth-db:5432/${AUTH_DB_NAME}
      JWT_SECRET: ${JWT_SECRET:?falta JWT_SECRET}
    depends_on:
      auth-db:
        condition: service_healthy
    networks: [auth-net, backend-net]
    ports:
      - "8001:8000"

networks:
  auth-net:
    internal: true
  backend-net:

volumes:
  auth-db-data:
